name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BRIDGE_ISSUER: https://mcp.example.com
          BUILD_RUNTIME_PROBE: '1'
      - run: npm run probe
      - run: node --test test/cli-binary.test.mjs
        env:
          LARK_TEST_BINARY: ${{ github.workspace }}/.vercel/output/functions/api/bridge.func/bin/lark-cli
      - run: npm run release:check
